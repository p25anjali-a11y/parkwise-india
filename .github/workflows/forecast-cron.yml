name: forecast-cron
# Vercel Hobby crons run at most once a day, so an hourly refresh is triggered from here.
# Needs repo secrets APP_URL (e.g. https://parkwise-india.vercel.app) and CRON_SECRET; skips cleanly when unset.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh forecasts
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET not set; skipping"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/forecast"
